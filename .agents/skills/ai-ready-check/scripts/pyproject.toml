[project]
name = "ai-ready-check-scripts"
version = "0.1.0"
description = "Deterministic helpers for the gru ai-ready-check skill: validate child Jira ticket against the ai-ready contract, post a structured comment, toggle the ai-ready label."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
